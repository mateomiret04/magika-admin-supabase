<div class="bg-white rounded-xl shadow-md hover:shadow-md transition-shadow duration-300 border border-transparent overflow-hidden flex flex-col h-full">
  
  <div class="h-40 sm:h-64 bg-white flex items-center justify-center overflow-hidden relative">
    <img 
      *ngIf="infoProducto?.imagen_url" 
      [src]="infoProducto.imagen_url" 
      [alt]="infoProducto.nombre"
      class="w-full h-full object-cover rounded-xl">
    
    <span *ngIf="!infoProducto?.imagen_url" class="text-xs uppercase font-medium text-gray-400">Sin Imagen</span> 

    <div *ngIf="infoProducto?.descuento > 0" class="absolute top-0 right-0 bg-[#739883] text-white text-[10px] font-medium px-3 py-1.5 rounded-bl-xl shadow-md">
      {{ infoProducto.descuento }}% OFF
    </div>
  </div>
  
  <div class="p-4 text-left flex-grow">
    <h3 class="font-medium text-gray-800 text-sm truncate" [title]="infoProducto?.nombre">
      {{ infoProducto?.nombre || 'Cargando...' }}
    </h3>
    <div class="flex flex-col items-start gap-0.5 mt-1">
      <p class="text-[#739883] font-medium text-xl">
        $ {{ infoProducto?.precio_base | number:'1.0-0' }}
      </p>
      <span class="text-[10px] text-gray-400 uppercase tracking-wider font-medium">
        Stock: {{ infoProducto?.stock || 0 }}
      </span>
    </div>
  </div>

    <div class="flex border-t border-gray-100 bg-white">
    <button 
      (click)="onEditar()" 
      class="w-1/2 py-3 bg-white text-[#739883] hover:bg-gray-50 transition-all flex justify-center items-center active:scale-95 border-r border-gray-100"
      title="Editar producto">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
      </svg>
    </button>

    <button 
      (click)="onBorrar()" 
      class="w-1/2 py-3 bg-white text-[#739883] hover:bg-gray-50 transition-all flex justify-center items-center active:scale-95"
      title="Eliminar producto">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
      </svg>
    </button>
  </div>
</div>
