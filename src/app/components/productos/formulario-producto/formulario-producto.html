<div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[150] p-4">
  <div #modalContainer class="bg-white rounded-2xl w-full max-w-lg p-6 shadow-2xl overflow-y-auto max-h-[90vh] relative">
    
    <div *ngIf="cargando" class="absolute inset-0 bg-white/90 backdrop-blur-sm z-50 flex items-center justify-center rounded-2xl">
      <div class="w-24 h-24">
        <img src="10.png" alt="Cargando..." class="w-full h-full object-contain animate-magika-reveal">
      </div>
    </div>

    <div [class.opacity-10]="cargando" class="transition-opacity duration-500">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-500 mb-1 ml-1">Nombre del Producto</label>
          <input [(ngModel)]="nuevoProducto.nombre" type="text" 
            class="w-full px-4 py-2 border border-gray-100 bg-gray-50 rounded-2xl focus:ring-2 focus:ring-[#739883]/30 focus:border-[#739883] outline-none transition-all text-gray-700" 
            placeholder="Nombre descriptivo">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-500 mb-1 ml-1">Precio Base</label>
          <input [(ngModel)]="nuevoProducto.precio_base" type="number" 
            class="w-full px-4 py-2 border border-gray-100 bg-gray-50 rounded-2xl focus:ring-2 focus:ring-[#739883]/30 focus:border-[#739883] outline-none transition-all text-gray-700"
            placeholder="0">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-500 mb-1 ml-1">Stock Inicial</label>
          <input [(ngModel)]="nuevoProducto.stock" type="number" 
            class="w-full px-4 py-2 border border-gray-100 bg-gray-50 rounded-2xl focus:ring-2 focus:ring-[#739883]/30 focus:border-[#739883] outline-none transition-all text-gray-700"
            placeholder="0">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-500 mb-1 ml-1">Categoría</label>
          <input [(ngModel)]="nuevoProducto.categoria" type="text" placeholder="Ej: Veladores" 
            class="w-full px-4 py-2 border border-gray-100 bg-gray-50 rounded-2xl focus:ring-2 focus:ring-[#739883]/30 focus:border-[#739883] outline-none transition-all text-gray-700">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-500 mb-1 ml-1">Descuento (%)</label>
          <input [(ngModel)]="nuevoProducto.descuento" type="number" 
            class="w-full px-4 py-2 border border-gray-100 bg-gray-50 rounded-2xl focus:ring-2 focus:ring-[#739883]/30 focus:border-[#739883] outline-none transition-all text-gray-700"
            placeholder="0">
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-500 mb-1 ml-1">Imagen del Producto</label>
          <div class="relative border-2 border-dashed border-gray-200 rounded-2xl p-6 hover:border-[#739883] transition-colors text-center bg-gray-50">
            <input 
              type="file" 
              (change)="onFileSelected($event)" 
              accept="image/*"
              class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
              [disabled]="cargando">
            
            <div class="space-y-2">
              <div class="flex justify-center text-[#739883]">
                <svg *ngIf="!archivoSeleccionado" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-10 h-10 text-gray-300">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z" />
                </svg>
                <svg *ngIf="archivoSeleccionado" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-10 h-10 text-gray-300">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6.75a1.5 1.5 0 0 0-1.5-1.5H3.75a1.5 1.5 0 0 0-1.5 1.5v12.75a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                </svg>
              </div>
              <div class="text-sm text-gray-600">
                <span *ngIf="!archivoSeleccionado" class="text-gray-300 font-medium block">Haz clic o arrastra una imagen</span>
                <span *ngIf="archivoSeleccionado" class="text-gray-300 font-medium block">Archivo listo</span>
              </div>
            </div>
          </div>
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-500 mb-1 ml-1">Descripción</label>
          <textarea 
            [(ngModel)]="nuevoProducto.descripcion" 
            (input)="autoExpand($event)"
            rows="1" 
            class="w-full px-4 py-2 border border-gray-100 bg-gray-50 rounded-2xl focus:ring-2 focus:ring-[#739883]/30 focus:border-[#739883] outline-none transition-all text-gray-700 resize-none overflow-hidden min-h-[42px]" 
            placeholder="Detalle del producto">
          </textarea>
        </div>
      </div>

      <div class="flex gap-3 mt-4">
        <button 
          (click)="cerrar()" 
          [disabled]="cargando"
          class="flex-1 py-3 text-gray-500 font-medium hover:bg-gray-100 rounded-3xl transition-all disabled:opacity-50">
          Cancelar
        </button>
        
        <button 
          (click)="guardar()" 
          [disabled]="cargando"
          class="flex-1 py-3 bg-[#739883] text-white font-medium rounded-3xl hover:bg-[#5f7d6c] shadow-lg shadow-[#739883]/20 transition-all active:scale-95 disabled:bg-gray-400">
          {{ cargando ? 'Enviando...' : 'Guardar' }}
        </button>
      </div>
    </div>
  </div>
</div>
